<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    rect.bg { fill: #E8ECF0 }
    rect.br { stroke: #0D1B2A }
    text    { fill: #0D1B2A }
    @media (prefers-color-scheme: dark) {
      rect.bg { fill: #0B1420 }
      rect.br { stroke: #E4EDF6 }
      text    { fill: #E4EDF6 }
    }
  </style>
  <rect class="bg" width="32" height="32"/>
  <rect class="br" x="3.5" y="3.5" width="25" height="25" fill="none" stroke-width="2"/>
  <text x="16" y="21.5" text-anchor="middle"
        font-family="IBM Plex Mono, ui-monospace, Consolas, monospace"
        font-size="11" letter-spacing="0.3">GM</text>
</svg>
